<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Multiverse Sound-Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            background-color: #080810;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
            cursor: crosshair;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            pointer-events: none;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            animation: fadeIn 2s ease-in;
        }
        .instructions {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.5;
            align-self: center;
            margin-auto: auto;
            animation: pulse 2s infinite;
        }
        .footer {
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.4;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        @keyframes pulse {
            0% { opacity: 0.2; }
            50% { opacity: 0.7; }
            100% { opacity: 0.2; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="ui-layer">
        <h1>Multiverse Sound-Canvas</h1>
        <div class="instructions" id="instruction-text">Tap or Move Mouse to Create Reality</div>
        <div class="footer">
            <span>Status: Connected to Cosmos</span>
            <span>Created via pure mathematics</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instructionText = document.getElementById('instruction-text');

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Setup (Web Audio API - No files needed)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                instructionText.style.display = 'none';
            }
        }

        function playTone(frequency, duration) {
            if (!audioCtx) return;
            
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Particle System
        const particles = [];
        const colors = ['#ff0055', '#00ffcc', '#9900ff', '#ffcc00', '#ff00ff'];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.05;
                this.alpha -= 0.01;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Interaction Event Listeners
        function handleInteraction(x, y) {
            initAudio();
            
            // Create particles
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(x, y));
            }

            // Map screen position to musical notes (Pentatonic scale feel)
            const baseFreq = 150;
            const freqModifier = (x / canvas.width) * 600 + (y / canvas.height) * 200;
            playTone(baseFreq + freqModifier, 0.8);
        }

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.3) { // Performance optimization
                handleInteraction(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchstart', (e) => {
            handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
        });

        window.addEventListener('touchmove', (e) => {
            handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
        });

        // Animation Loop
        function animate() {
            ctx.fillStyle = 'rgba(8, 8, 16, 0.15)'; // Trail effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0 || particles[i].size <= 0.1) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
